name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 認証は不要（マニフェストと SKILL.md をローカルに検証するだけ）
      # REJECT: [distill:ci-cli-version-unpinned]: 新しい検査項目を早く拾うために意図的に latest
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: make validate
